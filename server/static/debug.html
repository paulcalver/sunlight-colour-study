<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<title>CCT - DEBUG</title>
<style>
  html, body {
    margin: 0;
  }
  body {
    background: #fff;
    color: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    overflow-x: hidden; /* belt-and-braces: no fixed-width element should ever be able to force sideways panning on mobile */
    display: flex;
    flex-direction: column;
    align-items: center;
    /* flex-start (the default), not center: centering a flex container whose
       content is taller than the viewport pushes the overflow equally off
       BOTH edges, and most browsers won't let you scroll to the part pushed
       above the top -- content just becomes unreachable. Laying out from the
       top keeps everything reachable by normal scrolling regardless of how
       tall the page gets (this broke for real once the comparison strip
       pushed total height past one screen, 2026-07-29). */
    justify-content: flex-start;
    gap: 24px;
    padding: 24px 12px;
    box-sizing: border-box;
    width: 100%;
  }
  /* --- Compare strip: large flush swatches for whichever sensors are
     checked in the table below. Cell count is driven entirely by the
     checkbox state, so this scales to any number of sensors -- nothing here
     is tuned to a fixed sensor count (the old version hardcoded max-width
     to line up with exactly two 260px columns; that assumption is gone). */
  #compare {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 100%;
  }
  #compare-label {
    font-size: 11px;
    color: #999;
    text-align: center;
  }
  #compare-swatches {
    display: flex;
    flex-direction: row;
    width: 100%;
    border-radius: 12px;
    overflow: hidden; /* rounds the outer corners; joins between cells stay a sharp, flush line */
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
  }
  .compare-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1 1 0;
    min-width: 0; /* let cells actually shrink below their content's intrinsic width on narrow screens, instead of overflowing */
  }
  .compare-cell.hidden {
    display: none; /* unchecked in the table -- removed from the flex row entirely, remaining cells reflow to fill the space */
  }
  .compare-cell-colour {
    width: 100%;
    aspect-ratio: 1 / 1; /* stays square as it shrinks, rather than a fixed px size that overflows on mobile */
    max-height: 260px;
  }
  .compare-cell-raw {
    width: 100%;
    height: 70px; /* a shorter strip under the calibrated swatch, same width so the two line up */
    position: relative;
  }
  .compare-cell-raw::after {
    content: "raw";
    position: absolute;
    left: 6px;
    bottom: 4px;
    font-size: 10px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.85);
    mix-blend-mode: difference;
  }
  .compare-cell-raw.hidden {
    display: none;
  }
  .compare-cell-label {
    font-size: 11px;
    color: #999;
    padding: 6px 0 2px;
    background: #fff;
    text-align: center;
    text-transform: uppercase;
  }
  .compare-cell-calnote {
    font-size: 10px;
    color: #bbb;
    padding-bottom: 6px;
    background: #fff;
    text-align: center;
  }
  #compare-controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #fullscreen-btn {
    font-size: 11px;
    color: #666;
    background: #f5f5f5;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  #fullscreen-btn:hover {
    background: #eee;
  }
  #gradient-toggle-label, #raw-toggle-label {
    font-size: 11px;
    color: #666;
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    user-select: none;
  }

  /* --- Fullscreen swatch view: pure colour, equal columns, minimal label.
     A plain viewport-covering overlay rather than the browser's Fullscreen
     API -- stays within the browser window (chrome/tabs still visible),
     just occupies all of it. Columns mirror whichever compare cells are
     checked -- built once in init(), kept in sync on every poll tick and
     on every checkbox change, never rebuilt. */
  #fullscreen-view {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 9999;
    background: #000;
  }
  #fullscreen-view.active {
    display: flex;
    flex-direction: row;
  }
  .fs-col {
    position: relative;
    flex: 1 1 0;
    height: 100%;
    overflow: hidden; /* clips an overlong label at the column's own edge, rather than letting it bleed into the neighbouring column */
  }
  .fs-col.hidden {
    display: none;
  }
  /* Same font size/colour as the compare-cell label (.compare-cell-label)
     for visual consistency with the rest of the page -- toggled off
     entirely with "h" for a pure-colour view. */
  .fs-label {
    position: absolute;
    left: 14px;
    bottom: 14px;
    right: 14px;
    font-size: 11px;
    line-height: 1.4;
    color: #999;
    pointer-events: none;
  }
  /* Two lines, not one: the sensor name is the one part long enough to need
     ellipsis (e.g. sensor-00-calibration-source) -- keeping it on its own
     line means truncating it never eats into the K/live-status line, which
     is the part actually worth glancing at. */
  .fs-label-name, .fs-label-reading {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .fs-label-name {
    text-transform: uppercase;
  }
  #fullscreen-view.hide-text .fs-label {
    display: none;
  }

  /* --- Main sensor table. One row per sensor, so adding a 10th or 50th
     sensor just adds a row -- the layout never has to reflow or wrap the
     way a row of fixed-width columns would. Wrapped in a scrolling div
     rather than letting the table itself force the page wide, so a phone
     gets a horizontal scrollbar on the table only, not the whole page. */
  #table-scroll {
    align-self: flex-start; /* left-aligned rather than centered like the rest of the page -- a wide table centered in a much wider viewport just reads as a lot of dead space on both sides */
    width: 94%;
    margin-left: 3%; /* the 3% left margin plus the 94% width leaves a matching 3% gutter on the right too */
    overflow-x: auto;
  }
  table#sensors {
    width: 100%;
    min-width: 880px; /* below this the columns get too cramped to read; the scroll container takes over instead of squeezing them */
    border-collapse: collapse;
    font-size: 12.5px;
  }
  #sensors th, #sensors td {
    padding: 8px 10px;
    border-bottom: 1px solid #eee;
    text-align: left;
    vertical-align: top;
  }
  #sensors thead th {
    font-size: 11px;
    color: #999;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  #sensors td.col-sensor {
    white-space: nowrap;
  }
  #sensors tr.group-heading td {
    padding: 8px 6px 4px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #999;
    border-bottom: 1px solid #ddd;
  }
  #sensors tr.group-heading:not(:first-child) td {
    padding-top: 32px; /* the visible gap between the deployed and undeployed lists */
  }
  #sensors tr.group-heading button {
    all: inherit;
    cursor: pointer;
    padding: 0;
  }
  #sensors tr.group-heading button:hover { color: #666; }
  #sensors-body.undeployed-collapsed tr.undeployed-row { display: none; }
  .sensor-id {
    font-weight: 600;
    text-transform: uppercase;
  }
  .sensor-sublabel {
    font-size: 11px;
    color: #999;
  }
  .cct {
    font-size: 20px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .cal-note {
    font-size: 11px;
    color: #999;
  }
  .colour-cell {
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .colour-chip {
    width: 22px;
    height: 22px;
    border-radius: 5px;
    background: #eee;
    flex-shrink: 0;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
  }
  .colour-chip-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .hex {
    font-size: 13px;
    letter-spacing: 0.5px;
    color: #555;
  }
  .swatch-cal-note {
    font-size: 10px;
    color: #999;
  }
  .tint, .diag, .battery, .solar {
    font-size: 12px;
    color: #444;
    font-variant-numeric: tabular-nums;
  }
  .diag .warn, .battery .warn {
    color: #c00;
    font-weight: 600;
  }
  .time {
    font-size: 11px;
    color: #999;
    white-space: nowrap;
  }
  /* Live/stale badge next to the last-reading time. Only the stale state
     gets a colour -- a fresh reading shouldn't visually compete with the
     actual data, it should just look unremarkable. */
  .row-status {
    font-size: 11px;
    white-space: nowrap;
    color: #999;
  }
  .row-status.stale {
    color: #c00;
    font-weight: 700;
    background: rgba(200, 0, 0, 0.08);
    padding: 2px 6px;
    border-radius: 4px;
  }
  #status {
    font-size: 12px;
    color: #999;
  }

  /* --- Calibration: collapsed to a one-line status by default so a table
     with many sensors doesn't get overrun by the busiest per-sensor
     control; expands into a full-width row underneath only on request. */
  .calib-status-line {
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .calib-toggle {
    font-size: 11px;
    padding: 2px 8px;
    cursor: pointer;
  }
  tr.calib-detail-row.hidden {
    display: none;
  }
  tr.calib-detail-row td {
    background: #fafafa;
  }
  .calib-form {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    max-width: 640px;
  }
  .calib-form input {
    font-size: 12px;
    padding: 4px 6px;
    box-sizing: border-box;
  }
  .calib-form input.calib-cct,
  .calib-form input.calib-duv {
    width: 120px;
  }
  .calib-form input.calib-note {
    width: 220px;
  }
  .calib-buttons {
    display: flex;
    gap: 4px;
  }
  .calib-buttons button {
    font-size: 12px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .calib-msg {
    font-size: 11px;
    min-height: 14px;
    flex-basis: 100%;
  }
  .calib-msg.ok { color: #0a0; }
  .calib-msg.err { color: #c00; }
  #calib-token-row {
    font-size: 12px;
    color: #999;
  }
  #calib-token-row input {
    font-size: 12px;
    padding: 2px 6px;
    width: 140px;
  }
</style>
</head>
<body>

<div id="compare">
  <div id="compare-label">Side by side, no gap — for judging how close the hues actually are</div>
  <div id="compare-controls">
    <label id="gradient-toggle-label"><input type="checkbox" id="gradient-toggle" /> Today's gradient</label>
    <label id="raw-toggle-label"><input type="checkbox" id="raw-toggle" /> Show uncalibrated</label>
    <button id="fullscreen-btn" type="button">Full screen ⤢</button>
  </div>
  <div id="compare-swatches"></div>
</div>

<div id="fullscreen-view"></div>

<div id="table-scroll">
  <table id="sensors">
    <thead>
      <tr>
        <th>Compare</th>
        <th>Sensor</th>
        <th>CCT</th>
        <th>Colour</th>
        <th>Tint (Duv)</th>
        <th>Diagnostics</th>
        <th>Battery</th>
        <th>Solar</th>
        <th>Last reading</th>
        <th>Status</th>
        <th>Calibration</th>
      </tr>
    </thead>
    <tbody id="sensors-body"><!-- two <tr> per registered sensor (data row + collapsible calibration row), built by JS --></tbody>
  </table>
</div>

<div id="status">—</div>

<div id="calib-token-row">
  Lit Duo 1 calibration token (leave blank if none set):
  <input id="calib-token" type="password" autocomplete="off" />
</div>

<script>
// Served from the backend itself, so the API is same-origin: a relative path
// works on the Droplet and on localhost, with no CORS.
const API = "";  // same-origin; requests go to /api/...

// Below this lux the signal is near the sensor's noise floor and the measured
// chromaticity is unreliable, so the swatch shows "night" rather than a vivid
// noise colour. Matches DISPLAY_LUX_FLOOR server-side (main.py).
const LUX_FLOOR = 1.0;

// Above this age, a sensor's last reading is flagged red rather than just
// shown as a timestamp. Tuned for WiFi-1's 30s-300s publish cadence -- a
// unit on Cellular-1's ~30 min cadence (not deployed yet) would sit
// permanently stale under this same flat threshold; revisit once that
// track has a sensor registered.
const STALE_THRESHOLD_MS = 10 * 60 * 1000;

// "Today's gradient" toggle: buckets the current calendar day (viewer's local
// midnight to now) into fixed windows via /api/frames and strings the
// resulting colours into a CSS gradient. 10 min keeps the DOM/style string
// small while still giving a smooth arc across a full day (<=144 stops).
// Buckets below DISPLAY_LUX_FLOOR come back with null colour fields from the
// server -- exactly the "0 lux, out of scope" moments -- and are dropped
// rather than shown as a gap, so the gradient is built only from the
// remaining, evenly-spaced stops. Refreshed on its own slower interval
// (a new bucket appears at most every 10 min, so 5s like the live tick would
// just be wasted /api/frames queries over a growing day of history).
const GRADIENT_BUCKET_SECONDS = 600;
const GRADIENT_REFRESH_MS = 60 * 1000;

// The one unit that ever gets a meter reading typed in directly -- it stays
// permanently on the bench for exactly this reason (see CLAUDE.md's
// reference-unit policy). Every other sensor calibrates against *this one*
// instead, via its cct_cal/duv_cal, so no meter is needed for them.
const REFERENCE_SENSOR_ID = "sensor-00-calibration-source";
// Units installed at their final site. They are listed first and their compare/
// fullscreen boxes start ticked; every other registered sensor is listed below a
// gap as undeployed and starts unticked (tick one to compare). Add an ID here
// when a unit is installed. sensor-01 deployed 2026-10-06.
const DEPLOYED_SENSOR_IDS = new Set(["sensor-01"]);

const sensorsBodyEl = document.getElementById("sensors-body");
const statusEl = document.getElementById("status");
const compareSwatchesEl = document.getElementById("compare-swatches");
const compareLabelEl = document.getElementById("compare-label");
const fullscreenViewEl = document.getElementById("fullscreen-view");
const fullscreenBtn = document.getElementById("fullscreen-btn");
const gradientToggleEl = document.getElementById("gradient-toggle");
const rawToggleEl = document.getElementById("raw-toggle");

// Whether each compare-strip cell also shows a strip of the *uncalibrated*
// colour (from the raw cie_x/cie_y) under the calibrated swatch. Live mode
// only -- gradient mode has no raw counterpart. Remembered per browser.
let showRaw = false;
try { showRaw = localStorage.getItem("showRaw") === "1"; } catch (e) {}
rawToggleEl.checked = showRaw;

// Whether the compare-strip/fullscreen swatches show today's gradient instead
// of the live colour. The small per-row table chip always stays live --
// gradient detail wouldn't read at 22px, and the table is the diagnostic
// "what is it seeing right now" view. Populated by init(); each entry is
// { sensorId, els } so the toggle handler can refresh every sensor at once.
let gradientMode = false;
let gradientIntervalId = null;
const allSensorEls = [];

// Measured CIE x,y chromaticity -> sRGB: the true colour the sensor saw,
// including the green/magenta tint (Duv) that a single Kelvin number discards.
// Brightness is normalised away so this is a pure hue+tint chip.
function xyToRgb(x, y) {
  if (!(y > 0)) return [0, 0, 0];
  const X = x / y;
  const Y = 1;
  const Z = (1 - x - y) / y;
  // Linear sRGB from XYZ (D65 primaries).
  let r =  3.2406 * X - 1.5372 * Y - 0.4986 * Z;
  let g = -0.9689 * X + 1.8758 * Y + 0.0415 * Z;
  let b =  0.0557 * X - 0.2040 * Y + 1.0570 * Z;
  // Clamp out-of-gamut negatives, then normalise so the brightest channel is 1.
  r = Math.max(0, r); g = Math.max(0, g); b = Math.max(0, b);
  const peak = Math.max(r, g, b);
  if (peak > 0) { r /= peak; g /= peak; b /= peak; }
  const gamma = (c) => (c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055);
  const to255 = (c) => Math.max(0, Math.min(255, Math.round(gamma(c) * 255)));
  return [to255(r), to255(g), to255(b)];
}

function rgbToHex([r, g, b]) {
  const h = (v) => v.toString(16).padStart(2, "0");
  return "#" + h(r) + h(g) + h(b);
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

// Ported from the old full-screen colour page (main.js, retired 2026-09-17):
// the screen there never snapped between readings, it eased from whichever
// colour was on screen toward the new one over TRANSITION_MS, so it drifted
// smoothly through the day. Same idea here, applied per-element via a single
// shared requestAnimationFrame loop (animateLiveColours) instead of a p5.js
// draw() loop. Matches the 5s poll tick, so a reading's ease completes just
// as the next one arrives rather than holding still in between.
const LIVE_TRANSITION_MS = 5000;

function startColourEase(state, targetHex) {
  state.fromRgb = state.currentRgb || hexToRgb(targetHex);
  state.toRgb = hexToRgb(targetHex);
  state.transStart = performance.now();
}

// Returns the eased [r,g,b] for this frame, or null if this state has no
// target (e.g. a sensor that has never had a reading) -- callers should
// leave the element's background alone in that case, not paint anything.
function stepColourEase(state) {
  if (!state.toRgb) return null;
  const t = Math.min(1, (performance.now() - state.transStart) / LIVE_TRANSITION_MS);
  state.currentRgb = [0, 1, 2].map((i) => state.fromRgb[i] + (state.toRgb[i] - state.fromRgb[i]) * t);
  return state.currentRgb;
}

function rgbToCss([r, g, b]) {
  return "rgb(" + Math.round(r) + ", " + Math.round(g) + ", " + Math.round(b) + ")";
}

// "YYYY-MM-DD HH:MM:SS" in UTC, matching the naive-UTC format the server
// stores timestamps in and expects back on /api/frames' start/end params.
function toServerUtcTimestamp(d) {
  const p = (n) => String(n).padStart(2, "0");
  return d.getUTCFullYear() + "-" + p(d.getUTCMonth() + 1) + "-" + p(d.getUTCDate()) +
    " " + p(d.getUTCHours()) + ":" + p(d.getUTCMinutes()) + ":" + p(d.getUTCSeconds());
}

// Fetches today's (viewer's local midnight to now) bucketed colour for one
// sensor and paints it into the compare-strip cell and fullscreen column as
// a left-to-right CSS gradient, oldest on the left. Buckets below the
// display lux floor come back with null colour fields from the server (see
// /api/frames) -- exactly the "0 lux, out of scope" moments -- and are
// skipped rather than shown as a gap, so evenly-spaced gradient stops fall
// only on real daylight buckets.
async function refreshGradientFor(els, sensorId) {
  try {
    const now = new Date();
    const localMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
    const params = new URLSearchParams({
      sensor_id: sensorId,
      start: toServerUtcTimestamp(localMidnight),
      end: toServerUtcTimestamp(now),
      bucket: String(GRADIENT_BUCKET_SECONDS),
    });
    const resp = await fetch(API + "/api/frames?" + params);
    const frames = await resp.json();
    const stops = [];
    for (const f of frames) {
      const hasCal = f.cie_x_cal != null && f.cie_y_cal != null;
      const x = hasCal ? f.cie_x_cal : f.cie_x;
      const y = hasCal ? f.cie_y_cal : f.cie_y;
      if (x == null || y == null) continue; // below the lux floor -- out of scope
      stops.push(rgbToHex(xyToRgb(x, y)));
    }
    const bg = stops.length === 0 ? "#111111"
      : stops.length === 1 ? stops[0]
      : "linear-gradient(to right, " + stops.join(", ") + ")";
    els.compareColourEl.style.background = bg;
    els.fsColEl.style.background = bg;
    els.compareCalNoteEl.textContent = stops.length
      ? "today's gradient · " + stops.length + " pts"
      : "no daylight readings yet today";
  } catch (e) {
    els.compareCalNoteEl.textContent = "gradient: offline";
  }
}

function refreshAllGradients() {
  for (const { sensorId, els } of allSensorEls) refreshGradientFor(els, sensorId);
}

// Raw strips show only when ticked and not in gradient mode (no raw gradient).
function syncRawStrips() {
  for (const { els } of allSensorEls) {
    els.compareRawEl.classList.toggle("hidden", !showRaw || gradientMode);
  }
}

function wireRawToggle() {
  rawToggleEl.addEventListener("change", () => {
    showRaw = rawToggleEl.checked;
    try { localStorage.setItem("showRaw", showRaw ? "1" : "0"); } catch (e) {}
    syncRawStrips();
  });
  syncRawStrips();
}

function wireGradientToggle() {
  gradientToggleEl.addEventListener("change", () => {
    gradientMode = gradientToggleEl.checked;
    syncRawStrips();
    if (gradientMode) {
      refreshAllGradients();
      gradientIntervalId = setInterval(refreshAllGradients, GRADIENT_REFRESH_MS);
    } else {
      clearInterval(gradientIntervalId);
      gradientIntervalId = null;
      // Restore the live colour immediately rather than waiting for the next
      // 5s tick.
      for (const { sensorId, els } of allSensorEls) updateLatest(els, sensorId);
    }
  });
}

// Standing requestAnimationFrame loop: paints every sensor's eased colour
// onto its table chip (always) and its compare/fullscreen swatch (unless
// gradient mode owns that swatch instead). updateLatest()/the "no data" reset
// only ever set a *target* (startColourEase) or clear one outright -- this
// loop is the only thing that actually writes style.background from an
// ease, so there's one obvious place to look for how a colour lands on
// screen.
function animateLiveColours() {
  for (const { els } of allSensorEls) {
    const chipRgb = stepColourEase(els.chipEase);
    if (chipRgb) els.chipEl.style.background = rgbToCss(chipRgb);
    if (!gradientMode) {
      const compareRgb = stepColourEase(els.compareEase);
      if (compareRgb) els.compareColourEl.style.background = rgbToCss(compareRgb);
      const rawRgb = stepColourEase(els.rawEase);
      if (rawRgb && els.compareRawEl) els.compareRawEl.style.background = rgbToCss(rawRgb);
      const fsRgb = stepColourEase(els.fsEase);
      if (fsRgb) els.fsColEl.style.background = rgbToCss(fsRgb);
    }
  }
  requestAnimationFrame(animateLiveColours);
}

// Ages here span seconds (a unit publishing on its 30s cadence) to weeks
// (a unit parked offline between builds), so the unit steps up instead of
// counting minutes forever -- "18540m ago" tells you nothing at a glance.
// The coarser the age, the less the fine detail matters, so the second
// term is dropped once we're past a week.
function formatAge(ms) {
  const secs = Math.max(0, Math.round(ms / 1000));
  if (secs < 60) return "just now";
  const mins = Math.round(secs / 60);
  if (mins < 60) return mins + "m ago";
  const hours = Math.floor(mins / 60);
  if (hours < 24) {
    const remMins = mins - hours * 60;
    return remMins ? hours + "h " + remMins + "m ago" : hours + "h ago";
  }
  const days = Math.floor(hours / 24);
  if (days < 7) {
    const remHours = hours - days * 24;
    return remHours ? days + "d " + remHours + "h ago" : days + "d ago";
  }
  return days + "d ago";
}

// Recomputed against the current time on every poll tick (not just when a
// new reading arrives), so a sensor that's gone quiet visibly ages into
// "Stale" on its own even though the fetched data never changes.
function setRowStatus(els, when) {
  if (!when) {
    els.statusEl.textContent = "no data yet";
    els.statusEl.className = "row-status";
    return;
  }
  const age = Date.now() - when.getTime();
  if (age > STALE_THRESHOLD_MS) {
    els.statusEl.textContent = "Stale · " + formatAge(age);
    els.statusEl.className = "row-status stale";
  } else {
    els.statusEl.textContent = "Live · " + formatAge(age);
    els.statusEl.className = "row-status";
  }
}

// Minimal two-line label for the fullscreen swatch -- same live/stale
// threshold as the table's row status, condensed to a word each.
function setFsLabel(els, kText, when) {
  const liveWord = !when ? "no data" : (Date.now() - when.getTime() > STALE_THRESHOLD_MS ? "stale" : "live");
  els.fsReadingEl.textContent = kText ? kText + " · " + liveWord : liveWord;
}

// Every sensor gets manual CCT/Duv boxes for typing in a direct meter
// reading -- useful any time the meter is actually in hand for that sensor
// (e.g. a rented panel session covering more than just the reference unit),
// not just for sensor-00-calibration-source. Every non-reference sensor
// additionally gets the no-meter "vs sensor-00" button, for sessions where
// the meter isn't available for it. Both are independent add-point calls
// into the same calibration_points table -- ref_source records which kind
// each point was, so a fit mixing both is fine.
function calibFormMarkup(isReference) {
  const vsRefButton = isReference
    ? ""
    : `<button class="calib-add-vs-ref" type="button">Add point vs ${REFERENCE_SENSOR_ID}</button>`;
  return `
    <input class="calib-cct" type="number" step="1" placeholder="meter CCT (K)" />
    <input class="calib-duv" type="number" step="0.0001" placeholder="meter Duv" />
    <input class="calib-note" type="text" placeholder="note, e.g. clear midday (optional)" />
    <div class="calib-buttons">
      <button class="calib-add" type="button">Add point (meter)</button>
      ${vsRefButton}
      <button class="calib-fit" type="button">Fit now</button>
    </div>
    <div class="calib-msg"></div>
  `;
}

// Builds one sensor's DOM: a data row in the main table, a hidden
// calibration detail row right after it (toggled open on request), and a
// standalone compare-strip cell. Returns handles to everything that gets
// updated on each poll tick.
function buildSensorRow(sensorId, label) {
  const isReference = sensorId === REFERENCE_SENSOR_ID;

  const row = document.createElement("tr");
  row.innerHTML = `
    <td><input type="checkbox" class="compare-check"${DEPLOYED_SENSOR_IDS.has(sensorId) ? " checked" : ""} /></td>
    <td class="col-sensor">
      <div class="sensor-id">${sensorId}</div>
      ${label ? `<div class="sensor-sublabel">${label}</div>` : ""}
    </td>
    <td>
      <div class="cct">--- K</div>
      <div class="cal-note">—</div>
    </td>
    <td>
      <div class="colour-cell">
        <div class="colour-chip"></div>
        <div class="colour-chip-text">
          <div class="hex">#------</div>
          <div class="swatch-cal-note">—</div>
        </div>
      </div>
    </td>
    <td class="tint">—</td>
    <td class="diag">—</td>
    <td class="battery">—</td>
    <td class="solar">—</td>
    <td class="time">—</td>
    <td><span class="row-status">—</span></td>
    <td>
      <div class="calib-status-line">
        <span class="calib-status">Calibration: —</span>
        <button class="calib-toggle" type="button">Details ▾</button>
      </div>
    </td>
  `;

  const detailRow = document.createElement("tr");
  detailRow.className = "calib-detail-row hidden";
  detailRow.innerHTML = `<td colspan="11"><div class="calib-form">${calibFormMarkup(isReference)}</div></td>`;

  const toggleBtn = row.querySelector(".calib-toggle");
  toggleBtn.addEventListener("click", () => {
    const nowHidden = detailRow.classList.toggle("hidden");
    toggleBtn.textContent = nowHidden ? "Details ▾" : "Details ▲";
  });

  return {
    row,
    detailRow,
    isReference,
    checkboxEl: row.querySelector(".compare-check"),
    cctEl: row.querySelector(".cct"),
    calNoteEl: row.querySelector(".cal-note"),
    chipEl: row.querySelector(".colour-chip"),
    hexEl: row.querySelector(".hex"),
    swatchCalNoteEl: row.querySelector(".swatch-cal-note"),
    timeEl: row.querySelector(".time"),
    statusEl: row.querySelector(".row-status"),
    tintEl: row.querySelector(".tint"),
    diagEl: row.querySelector(".diag"),
    batteryEl: row.querySelector(".battery"),
    solarEl: row.querySelector(".solar"),
    calibStatusEl: row.querySelector(".calib-status"),
    calibCctEl: detailRow.querySelector(".calib-cct"),
    calibDuvEl: detailRow.querySelector(".calib-duv"),
    calibNoteEl: detailRow.querySelector(".calib-note"),
    calibAddBtn: detailRow.querySelector(".calib-add"),
    calibAddVsRefBtn: detailRow.querySelector(".calib-add-vs-ref"),
    calibFitBtn: detailRow.querySelector(".calib-fit"),
    calibMsgEl: detailRow.querySelector(".calib-msg"),
    // Colour-ease state for the live swatches (see startColourEase/
    // stepColourEase) -- one independent ease per element, since the
    // fullscreen column can be hidden/shown independently of the table row.
    chipEase: {},
    compareEase: {},
    rawEase: {},
    fsEase: {},
  };
}

// One flush-fitting colour cell per sensor in the comparison strip -- no
// gap, no per-cell rounding, so the join between two sensors' hues is a
// single sharp line rather than something broken up by column chrome.
// Visibility is driven purely by the row's own checkbox (see wireCompareCheckbox),
// so the strip scales to however many sensors are ticked, not a fixed count.
function buildCompareCell(sensorId) {
  const cell = document.createElement("div");
  cell.className = "compare-cell";
  cell.innerHTML = `
    <div class="compare-cell-colour"></div>
    <div class="compare-cell-raw hidden"></div>
    <div class="compare-cell-label">${sensorId}</div>
    <div class="compare-cell-calnote">—</div>
  `;
  return {
    cell,
    colourEl: cell.querySelector(".compare-cell-colour"),
    rawEl: cell.querySelector(".compare-cell-raw"),
    calNoteEl: cell.querySelector(".compare-cell-calnote"),
  };
}

// Colour column for the fullscreen view, plus one small overlaid label
// (sensor name, current K, live/stale) -- hidden entirely with "h" for a
// pure-colour view, shown by default for orientation.
function buildFullscreenCol(sensorId) {
  const col = document.createElement("div");
  col.className = "fs-col";
  const label = document.createElement("div");
  label.className = "fs-label";
  label.innerHTML = `<div class="fs-label-name"></div><div class="fs-label-reading"></div>`;
  const nameEl = label.querySelector(".fs-label-name");
  const readingEl = label.querySelector(".fs-label-reading");
  nameEl.textContent = sensorId;
  readingEl.textContent = "—";
  col.appendChild(label);
  return { col, nameEl, readingEl };
}

function updateCompareLabel() {
  const checkedCount = document.querySelectorAll(".compare-check:checked").length;
  compareLabelEl.textContent = checkedCount > 0
    ? "Side by side, no gap — for judging how close the hues actually are"
    : "Tick sensors in the table below to compare their colours here, side by side";
}

function wireCompareCheckbox(els) {
  const sync = () => {
    els.compareCell.classList.toggle("hidden", !els.checkboxEl.checked);
    els.fsColEl.classList.toggle("hidden", !els.checkboxEl.checked);
    updateCompareLabel();
  };
  els.checkboxEl.addEventListener("change", sync);
  sync();
}

// Plain viewport-covering overlay, not the browser's Fullscreen API -- stays
// inside the browser window (tabs/chrome untouched), so exiting is entirely
// our own UI: Escape, or a click/tap anywhere on the swatches.
function setFullscreenActive(active) {
  fullscreenViewEl.classList.toggle("active", active);
  fullscreenBtn.textContent = active ? "Exit (Esc)" : "Full screen ⤢";
}

function wireFullscreenButton() {
  fullscreenBtn.addEventListener("click", () => setFullscreenActive(true));
  fullscreenViewEl.addEventListener("click", () => setFullscreenActive(false));
  document.addEventListener("keydown", (e) => {
    if (!fullscreenViewEl.classList.contains("active")) return;
    if (e.key === "Escape") {
      setFullscreenActive(false);
    } else if (e.key === "h" || e.key === "H") {
      fullscreenViewEl.classList.toggle("hide-text");
    }
  });
}

async function updateLatest(els, sensorId) {
  try {
    const resp = await fetch(API + "/api/latest?sensor_id=" + encodeURIComponent(sensorId));
    const data = await resp.json();
    if (data.error || data.cct == null) {
      els.cctEl.textContent = "waiting…";
      els.calNoteEl.textContent = "—";
      setRowStatus(els, null);
      setFsLabel(els, null, null);
      // Reset the swatches too, bypassing the ease -- otherwise a sensor with
      // no data at all would stay stuck on whatever it last showed (a live
      // colour, or whatever the gradient toggle last painted there), since
      // this early return would never overwrite it. There's no meaningful
      // colour to ease *toward* for "no data", so this is a hard cut, not a
      // fade, in both the ease state and the elements it's about to stop
      // driving.
      els.chipEase.toRgb = null;
      els.chipEl.style.background = "";
      if (!gradientMode) {
        els.compareEase.toRgb = null;
        els.compareColourEl.style.background = "";
        els.rawEase.toRgb = null;
        els.compareRawEl.style.background = "";
        els.compareCalNoteEl.textContent = "—";
        els.fsEase.toRgb = null;
        els.fsColEl.style.background = "";
      }
      return;
    }

    // Calibrated CCT (fit against a reference meter) is the headline number
    // once a sensor has one; raw CCT is the fallback and always shown as a
    // caption alongside it, so the diagnostics page never hides which number
    // is which.
    const hasCal = data.cct_cal != null;
    els.cctEl.textContent = Math.round(hasCal ? data.cct_cal : data.cct) + " K";
    els.calNoteEl.textContent = hasCal
      ? "calibrated · raw " + Math.round(data.cct) + " K"
      : "raw · uncalibrated";

    // Measured colour from the stored chromaticity (true hue and tint) --
    // calibrated x,y once a fit exists, since the raw reading is the biased
    // one the C-800 calibration exists to correct, not the more truthful one.
    // Below the reliability floor the chromaticity is noise, so the swatch
    // shows "night" (#111) rather than a misleading vivid colour; the numeric
    // CCT and Duv still display for diagnostics.
    const lowLight = data.lux != null && data.lux < LUX_FLOOR;
    const swatchHasCal = data.cie_x_cal != null && data.cie_y_cal != null;
    const swatchX = swatchHasCal ? data.cie_x_cal : data.cie_x;
    const swatchY = swatchHasCal ? data.cie_y_cal : data.cie_y;
    let hex = null;
    if (lowLight) {
      hex = "#111111";
      els.hexEl.textContent = "night";
      els.swatchCalNoteEl.textContent = "—";
      if (!gradientMode) els.compareCalNoteEl.textContent = "—";
    } else if (swatchX != null && swatchY != null) {
      hex = rgbToHex(xyToRgb(swatchX, swatchY));
      els.hexEl.textContent = hex.toUpperCase();
      const calNote = swatchHasCal ? "calibrated" : "raw · uncalibrated";
      els.swatchCalNoteEl.textContent = calNote;
      if (!gradientMode) els.compareCalNoteEl.textContent = calNote;
    } else {
      hex = "#eeeeee";
      els.hexEl.textContent = "—";
      els.swatchCalNoteEl.textContent = "—";
      if (!gradientMode) els.compareCalNoteEl.textContent = "—";
    }
    // The small table chip always shows the live colour, gradient mode or
    // not. The compare-strip cell and fullscreen column are the ones that
    // switch to today's gradient -- skip starting an ease for them here so
    // the 5s live tick doesn't clobber it; refreshGradientFor() (on its own
    // slower interval) owns their background while gradient mode is on. This
    // only sets the *target* -- animateLiveColours() (a standing
    // requestAnimationFrame loop) is what actually paints the eased colour
    // onto the elements, frame by frame.
    startColourEase(els.chipEase, hex);
    let rawHex = "#eeeeee";
    if (lowLight) rawHex = "#111111";
    else if (data.cie_x != null && data.cie_y != null) rawHex = rgbToHex(xyToRgb(data.cie_x, data.cie_y));
    if (!gradientMode) {
      startColourEase(els.rawEase, rawHex);
      // Same computed hex feeds both remaining views, so they can never
      // disagree due to being fetched at slightly different moments -- one
      // fetch, both swatches.
      startColourEase(els.compareEase, hex);
      startColourEase(els.fsEase, hex);
    }

    // Server stores naive UTC strings ("2026-06-22 13:12:00"). Tell the
    // browser it's UTC (replace space with "T", append "Z"), then render it
    // in the viewer's own local timezone.
    const when = new Date(data.timestamp.replace(" ", "T") + "Z");
    els.timeEl.textContent = when.toLocaleString();
    setRowStatus(els, when);
    setFsLabel(els, Math.round(hasCal ? data.cct_cal : data.cct) + "K", when);

    // Tint (Duv): how far off the blackbody locus the light sits — the axis CCT
    // alone throws away. Positive is greenish (above the locus), negative is
    // magenta/pink (below). Computed server-side from the measured x,y.
    if (data.duv != null && !lowLight) {
      const duvShown = data.duv_cal != null ? data.duv_cal : data.duv;
      const sign = duvShown > 0 ? "+" : "";
      const cast = Math.abs(duvShown) < 0.001
        ? "near-neutral"
        : (duvShown > 0 ? "greenish" : "magenta");
      let text = sign + duvShown.toFixed(4) + " (" + cast + ")";
      if (data.duv_cal != null) {
        text += " · raw " + (data.duv > 0 ? "+" : "") + data.duv.toFixed(4);
      }
      els.tintEl.textContent = text;
    } else if (lowLight) {
      els.tintEl.textContent = "low light — below reliable floor";
    } else {
      els.tintEl.textContent = "—";
    }

    // Solar geometry, computed server-side from the reading's location and time.
    // Null until the sensor's location has been registered. A negative elevation
    // means the sun is below the horizon (night).
    if (data.solar_elevation_deg != null) {
      const elev = data.solar_elevation_deg.toFixed(1) + "°";
      const azi = data.solar_azimuth_deg != null
        ? data.solar_azimuth_deg.toFixed(0) + "°"
        : "—";
      const daynight = data.solar_elevation_deg >= 0 ? "day" : "night";
      let loc = "";
      if (data.latitude != null && data.longitude != null) {
        loc = " · " + data.latitude.toFixed(4) + ", " + data.longitude.toFixed(4);
      }
      els.solarEl.innerHTML = elev + " elev (" + daynight + ") · " + azi + " azi" + loc;
    } else {
      els.solarEl.textContent = "location not set";
    }
  } catch (e) {
    els.cctEl.textContent = "offline";
    els.statusEl.textContent = "offline";
    els.statusEl.className = "row-status stale";
  }
}

// Live diagnostics from /api/diag (raw channels etc. — not stored in the DB),
// scoped to this sensor so two units publishing concurrently don't clobber
// each other's readout.
async function updateDiag(els, sensorId) {
  try {
    const resp = await fetch(API + "/api/diag?sensor_id=" + encodeURIComponent(sensorId));
    const d = await resp.json();
    if (d.error) {
      els.diagEl.textContent = "waiting…";
      els.batteryEl.textContent = "";
      return;
    }
    const lux = d.lux != null ? Math.round(d.lux).toLocaleString() : "—";
    const xy = (d.cie_x != null && d.cie_y != null) ? d.cie_x + ", " + d.cie_y : "—";
    const zx = d.zx_ratio != null ? d.zx_ratio : "—";
    const overload = d.overload
      ? '<span class="warn">YES — saturated!</span>'
      : "no";
    // Wi-Fi link quality, from firmware that reports wifi_rssi (older units
    // omit it). Rough bands for the ESP32: > -60 solid, -60..-70 usable,
    // < -70 marginal and prone to dropouts.
    let wifi = "—";
    if (d.wifi_rssi != null) {
      const r = d.wifi_rssi;
      const band = r > -60 ? "good" : r >= -70 ? "fair" : "weak";
      const ssid = d.wifi_ssid
        ? " (" + String(d.wifi_ssid).replace(/[&<>"']/g, c => "&#" + c.charCodeAt(0) + ";") + ")"
        : "";
      wifi = band === "weak"
        ? '<span class="warn">' + r + " dBm " + band + "</span>" + ssid
        : r + " dBm " + band + ssid;
    }
    // Readings the unit is holding to send later (store-and-forward firmware
    // only; approximate for the part already on its flash).
    let backlog = "";
    if (d.backlog_rows != null && d.backlog_rows > 0) {
      backlog = ' · <span class="warn">Backlog: ~' + d.backlog_rows.toLocaleString() + "</span>";
    }
    els.diagEl.innerHTML =
      "Lux: " + lux + " · x,y: " + xy + " · Z/X: " + zx + " · Overload: " + overload +
      " · WiFi: " + wifi + backlog;

    if (d.battery_pct != null) {
      const pct  = d.battery_pct.toFixed(1) + "%";
      const volts = d.battery_v != null ? d.battery_v.toFixed(3) + "V" : "—";
      const tempVal = d.battery_temp_c != null ? d.battery_temp_c.toFixed(1) + "°C" : "—";
      const temp = d.temp_warning
        ? '<span class="warn">' + tempVal + ' ⚠ HIGH TEMP</span>'
        : tempVal;
      els.batteryEl.innerHTML = pct + " · " + volts + " · " + temp;
    } else {
      els.batteryEl.textContent = "not connected";
    }
  } catch (e) {
    els.diagEl.textContent = "offline";
    els.batteryEl.textContent = "";
  }
}

// Calibration token, if the backend has CALIBRATION_TOKEN set (see main.py --
// open/no-op by default, so this is blank unless deliberately locked down).
// Remembered in localStorage so it survives a page reload during a session.
const tokenEl = document.getElementById("calib-token");
tokenEl.value = localStorage.getItem("calibToken") || "";
tokenEl.addEventListener("input", () => {
  localStorage.setItem("calibToken", tokenEl.value);
});

function fmtDuv(v) {
  return (v > 0 ? "+" : "") + v.toFixed(4);
}

async function updateCalibStatus(els, sensorId) {
  try {
    const resp = await fetch(API + "/api/calibration/status?sensor_id=" + encodeURIComponent(sensorId));
    const data = await resp.json();
    const n = data.points ? data.points.length : 0;
    if (data.calibration) {
      const c = data.calibration;
      const rms = (c.rms_cct != null ? c.rms_cct.toFixed(1) + " K" : "—") +
        " / " + (c.rms_duv != null ? c.rms_duv.toFixed(5) + " Duv" : "—");
      els.calibStatusEl.textContent =
        "Calibrated: " + n + " pt(s), RMS " + rms;
    } else {
      els.calibStatusEl.textContent =
        n + " pt(s) captured — not fitted yet";
    }
  } catch (e) {
    els.calibStatusEl.textContent = "Calibration: offline";
  }
}

function setCalibMsg(els, text, isError) {
  els.calibMsgEl.textContent = text;
  els.calibMsgEl.className = "calib-msg " + (isError ? "err" : "ok");
}

function wireCalibForm(els, sensorId) {
  // Direct meter entry -- wired for every sensor now, not just the reference
  // unit (see calibFormMarkup).
  els.calibAddBtn.addEventListener("click", async () => {
    const cctRef = parseFloat(els.calibCctEl.value);
    const duvRef = parseFloat(els.calibDuvEl.value);
    if (!Number.isFinite(cctRef) || !Number.isFinite(duvRef)) {
      setCalibMsg(els, "Enter both CCT and Duv from the meter.", true);
      return;
    }
    els.calibAddBtn.disabled = true;
    try {
      const params = new URLSearchParams({
        sensor_id: sensorId,
        cct_ref: cctRef,
        duv_ref: duvRef,
        token: tokenEl.value,
      });
      if (els.calibNoteEl.value) params.set("note", els.calibNoteEl.value);
      const resp = await fetch(API + "/api/calibration/add-point?" + params, { method: "POST" });
      const data = await resp.json();
      if (!resp.ok) {
        setCalibMsg(els, "Error: " + (data.error || resp.status), true);
      } else {
        setCalibMsg(
          els,
          "Added — device " + Math.round(data.cct_raw) + "K/" + fmtDuv(data.duv_raw) +
            " vs meter " + Math.round(cctRef) + "K/" + fmtDuv(duvRef),
          false,
        );
        els.calibCctEl.value = "";
        els.calibDuvEl.value = "";
        updateCalibStatus(els, sensorId);
      }
    } catch (e) {
      setCalibMsg(els, "Error: request failed", true);
    } finally {
      els.calibAddBtn.disabled = false;
    }
  });

  // No-meter "vs reference sensor" path -- only present (button exists) for
  // non-reference sensors, per calibFormMarkup.
  if (els.calibAddVsRefBtn) {
    els.calibAddVsRefBtn.addEventListener("click", async () => {
      els.calibAddVsRefBtn.disabled = true;
      try {
        const params = new URLSearchParams({
          sensor_id: sensorId,
          reference_sensor_id: REFERENCE_SENSOR_ID,
          token: tokenEl.value,
        });
        if (els.calibNoteEl.value) params.set("note", els.calibNoteEl.value);
        const resp = await fetch(API + "/api/calibration/add-point-vs-sensor?" + params, { method: "POST" });
        const data = await resp.json();
        if (!resp.ok) {
          setCalibMsg(els, "Error: " + (data.error || resp.status), true);
        } else {
          setCalibMsg(
            els,
            "Added — device " + Math.round(data.cct_raw) + "K/" + fmtDuv(data.duv_raw) +
              " vs " + REFERENCE_SENSOR_ID + " " + Math.round(data.cct_ref) + "K/" + fmtDuv(data.duv_ref),
            false,
          );
          updateCalibStatus(els, sensorId);
        }
      } catch (e) {
        setCalibMsg(els, "Error: request failed", true);
      } finally {
        els.calibAddVsRefBtn.disabled = false;
      }
    });
  }

  els.calibFitBtn.addEventListener("click", async () => {
    els.calibFitBtn.disabled = true;
    try {
      const params = new URLSearchParams({ sensor_id: sensorId, token: tokenEl.value });
      const resp = await fetch(API + "/api/calibration/fit?" + params, { method: "POST" });
      const data = await resp.json();
      if (!resp.ok) {
        setCalibMsg(els, "Error: " + (data.error || resp.status), true);
      } else {
        const rmsCct = data.rms_cct != null ? data.rms_cct.toFixed(1) : "—";
        const rmsDuv = data.rms_duv != null ? data.rms_duv.toFixed(5) : "—";
        setCalibMsg(
          els,
          "Fitted from " + data.n_points + " pt(s), RMS " +
            rmsCct + "K/" + rmsDuv +
            " — backfilled " + data.backfilled,
          false,
        );
        updateCalibStatus(els, sensorId);
        updateLatest(els, sensorId);  // headline CCT should reflect the new fit immediately
      }
    } catch (e) {
      setCalibMsg(els, "Error: request failed", true);
    } finally {
      els.calibFitBtn.disabled = false;
    }
  });
}

async function init() {
  let sensors = [];
  try {
    const resp = await fetch(API + "/api/sensors");
    sensors = await resp.json();
  } catch (e) {
    statusEl.textContent = "Could not load sensor list — retrying…";
    setTimeout(init, 5000);
    return;
  }

  if (!Array.isArray(sensors) || sensors.length === 0) {
    statusEl.textContent = "No sensors registered yet.";
    setTimeout(init, 5000);
    return;
  }

  statusEl.textContent = "";
  sensorsBodyEl.innerHTML = "";
  compareSwatchesEl.innerHTML = "";
  // Deployed units first, then a gap and the undeployed ones; each group keeps
  // the server's order. The group headings only show when both groups exist.
  const deployed = sensors.filter((s) => DEPLOYED_SENSOR_IDS.has(s.sensor_id));
  const undeployed = sensors.filter((s) => !DEPLOYED_SENSOR_IDS.has(s.sensor_id));
  const split = deployed.length > 0 && undeployed.length > 0;
  const addGroupHeading = (text) => {
    const tr = document.createElement("tr");
    tr.className = "group-heading";
    tr.innerHTML = `<td colspan="11">${text}</td>`;
    sensorsBodyEl.appendChild(tr);
    return tr;
  };
  if (split) addGroupHeading("Deployed");
  // The undeployed list is collapsed by default behind its heading, and the
  // choice is remembered per browser. Collapsed rows are only hidden: they keep
  // polling, so opening the list shows current data straight away.
  let undeployedOpen = false;
  try { undeployedOpen = localStorage.getItem("undeployedOpen") === "1"; } catch (e) {}
  const applyUndeployedOpen = (btn) => {
    sensorsBodyEl.classList.toggle("undeployed-collapsed", split && !undeployedOpen);
    if (btn) {
      btn.textContent = (undeployedOpen ? "\u25BE " : "\u25B8 ") + "Undeployed (" + undeployed.length + ")";
      btn.setAttribute("aria-expanded", undeployedOpen ? "true" : "false");
    }
  };
  for (const s of [...deployed, ...undeployed]) {
    const isUndeployed = !DEPLOYED_SENSOR_IDS.has(s.sensor_id);
    if (split && s === undeployed[0]) {
      const tr = addGroupHeading("");
      const btn = document.createElement("button");
      btn.type = "button";
      tr.firstElementChild.appendChild(btn);
      btn.addEventListener("click", () => {
        undeployedOpen = !undeployedOpen;
        try { localStorage.setItem("undeployedOpen", undeployedOpen ? "1" : "0"); } catch (e) {}
        applyUndeployedOpen(btn);
      });
      applyUndeployedOpen(btn);
    }
    const els = buildSensorRow(s.sensor_id, s.label);
    if (isUndeployed) {
      els.row.classList.add("undeployed-row");
      els.detailRow.classList.add("undeployed-row");
    }
    sensorsBodyEl.appendChild(els.row);
    sensorsBodyEl.appendChild(els.detailRow);

    const compareCell = buildCompareCell(s.sensor_id);
    compareSwatchesEl.appendChild(compareCell.cell);
    els.compareCell = compareCell.cell;
    els.compareColourEl = compareCell.colourEl;
    els.compareCalNoteEl = compareCell.calNoteEl;
    els.compareRawEl = compareCell.rawEl;

    const fsCol = buildFullscreenCol(s.sensor_id);
    fullscreenViewEl.appendChild(fsCol.col);
    els.fsColEl = fsCol.col;
    els.fsReadingEl = fsCol.readingEl;

    wireCompareCheckbox(els);
    allSensorEls.push({ sensorId: s.sensor_id, els });

    wireCalibForm(els, s.sensor_id);
    const tick = () => {
      updateLatest(els, s.sensor_id);
      updateDiag(els, s.sensor_id);
      updateCalibStatus(els, s.sensor_id);
    };
    tick();
    setInterval(tick, 5000);
  }
  updateCompareLabel();
  wireFullscreenButton();
  wireGradientToggle();
  wireRawToggle();
  requestAnimationFrame(animateLiveColours);
}

init();
</script>

</body>
</html>
